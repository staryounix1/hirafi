# pnpm 10+ blocks dependency build scripts by default; esbuild needs its build
# step (its native binary, used by Vite/@tailwindcss). Explicitly allow it.
# (pnpm 11 moved this out of package.json's "pnpm" field into this file.)
#
# `packages` must be present: Vercel runs a second `pnpm install` during the
# serverless packaging pass, and without it pnpm exits with
# "packages field missing or empty" and the whole build fails.
packages:
  - "."

allowBuilds:
  esbuild: true
